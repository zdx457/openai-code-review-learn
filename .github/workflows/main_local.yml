name: Run Java Git Diff By Local

on:
  push:
    branches:
      - 260324-zdx-chatglm-review
  pull_request:
    branches:  # 修正拼写错误 braches -> branches
      - 260324-zdx-chatglm-review

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository  # 修正格式：-和name之间加空格
        uses: actions/checkout@v4  # 升级到最新稳定版 v4
        with: 
          fetch-depth: 2

      - name: Set up JDK 11  # 修正格式：-和name之间加空格
        uses: actions/setup-java@v4  # 修正拼写错误 users -> uses，升级到 v4
        with: 
          distribution: 'temurin'
          java-version: '11'

      - name: Run java code  # 修正格式：name后加冒号，Run -> Run java code 补全格式
        run: |  # 使用 | 来执行多行命令
          cd openai-code-review-sdk/src/main/java
          # 确保编译路径正确，指定输出目录（避免类文件散列）
          javac -d . com/zdx/ai/sdk/OpenAiCodeReview.java
          # 修正Java大小写：Java -> java
          java com.zdx.ai.sdk.OpenAiCodeReview
        # 添加错误处理：如果命令失败，立即终止工作流
        shell: bash
